.hero .eyebrow.up{animation-delay:.1s}.hero h1.up{animation-delay:.25s}.hero .sub.up{animation-delay:.45s}.hero .rule.up{animation-delay:.55s}.hero .company.up{animation-delay:.65s}.hero .legal.up{animation-delay:.8s}.scrollhint.up{animation-delay:1.2s}

/* 進場動態。第一順位：純 CSS 捲動驅動動畫（Safari 26、Chrome 115 起），不靠 JavaScript；
   第二順位：JavaScript 的 IntersectionObserver 加 .in；都沒有就靜態顯示。 */
.js .reveal{opacity:0;transform:translateX(-34px);transition:opacity .7s cubic-bezier(.1,.9,.2,1),transform .7s cubic-bezier(.1,.9,.2,1)}
.js .stat.reveal{transform:translateY(20px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.js .reveal.in{opacity:1;transform:none}
@supports (animation-timeline: view()){
  .reveal,.js .reveal{opacity:0;transform:translateX(-40px) scale(.985);transition:none;animation:enter linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
  .timeline .reveal,.js .timeline .reveal{transform:translateX(-26px)}
  .stat.reveal,.js .stat.reveal{transform:translateY(24px);animation-range:entry 0% entry 62%}
  .card .bar{transform-origin:left center;transform:scaleX(0);animation:draw linear both;animation-timeline:view();animation-range:entry 25% entry 85%}
  .stat .big{transform:scale(.86);transform-origin:left center;opacity:0;animation:pop linear both;animation-timeline:view();animation-range:entry 5% entry 60%}
  .timeline .dot{transform:scale(0);animation:pop2 linear both;animation-timeline:view();animation-range:entry 20% entry 75%}
}
@keyframes enter{to{opacity:1;transform:none}}
@keyframes draw{to{transform:scaleX(1)}}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes pop2{to{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.reveal,.up,.card .bar,.stat .big,.timeline .dot{opacity:1;transform:none;animation:none;transition:none}.scrollhint span{animation:none}}

<body>
<script>document.documentElement.className+=' js';</script>
<div id="bar"></div>
<div id="langpick">
  <div class="pickbox">
    <div class="eyebrow"><span class="bar"></span>PROJECT MERIDIAN</div>
    <div class="mark">MERIDIAN</div>
    <h1>選擇語言</h1>

    },

      var now = performance.now();

 class=\"eyebrow up\"><span class=\"bar\"><\/span>PROJECT MERIDIAN<\/div>\n    <h1 class=\"up\"><span class=\"nw\">一場 FIA 世界錦標賽層級的<\/span><span class=\"nw\">國際賽事，評估在台灣舉辦<\/span><\/h1>\n    <p class=\"sub up\"><span class=\"nw\">目標 2028 年暑期<\/span><span class=\"sep\">｜<\/span><span class=\"nw\">台灣首次<\/span><span class=\"sep\">｜<\/span><span class=\"nw\">Project Meridian<\/span><\/p>\n    <div class=\"rule up\"><\/div>\n    <p class=\"company up\">MOTIVIBES 立睦騰股份有限公司<\/p>\n    <p class=\"legal up\">本資料僅說明專案方向，<br class=\"m\">內容截至 2026 年第三季。<\/p>\n  <\/div>\n  <div class=\"scrollhint up\"><span><\/span><\/div>\n<\/section>\n\n<section class=\"s dark bg\" id=\"p2\" style=\"background-image:url(__IMG_global__)\">\n  <div class=\"shade\"><\/div>\n  <div class=\"wrap\">\n    <div class=\"eyebrow reveal\">機會與時機<\/div>\n    <h2 class=\"reveal\"><span class=\"nw\">台灣還沒有過<\/span><span class=\"nw\">這個層級的國際賽事<\/span><\/h2>\n    <div class=\"grid\"><article class=\"card reveal\"><span class=\"bar\"><\/span><h3>賽事層級<\/h3><p>FIA（國際汽車聯盟）世界錦標賽是國際汽車運動的最高層級。<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3>全球觀眾規模<\/h3><p>評估在台灣舉辦的這場賽事（下稱本賽事），2024 至 2025 年的賽季，全球累積電視觀眾 5.61 億人次、年增 14%，全球粉絲 4.22 億。<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3>亞洲的空缺<\/h3><p>2026 年，本賽事在東亞的分站位於三座城市，仍有明顯的空白市場。<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3>時間<\/h3><p>目標 2028 年。台灣已有國際認證賽道，<span class=\"nw\">不需新建。<\/span><\/p><\/article><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"s dark\" id=\"p3\">\n  <div class=\"banner\" style=\"background-image:url(__IMG_performance__)\"><\/div>\n  <div class=\"wrap\">\n    <div class=\"eyebrow reveal\">本賽事的量級與前景<\/div>\n    <h2 class=\"reveal\"><span class=\"nw\">成熟的世界級賽事，<\/span><span class=\"nw\">賽車性能、賽曆與觀眾<\/span><span class=\"nw\">同步成長<\/span><\/h2>\n    <div class=\"grid\"><article class=\"card reveal\"><span class=\"bar\"><\/span><h3><span class=\"n\">1.<\/span> 全世界的電動賽車世界錦標賽，<span class=\"nw\">只有這一個<\/span><\/h3><p>FIA 授予「世界錦標賽」名銜的賽事屈指可數，全電動的只有本賽事。汽車產業往電動轉向，車廠需要世界級的參賽場合。FIA 已將本賽事的推廣權至少延長到 2048 年，另含再延五年的選擇權，並延續其在單座賽車類別的全電動獨佔地位。<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3><span class=\"n\">2.<\/span> 國際資本與頂尖車廠已經到位<\/h3><p>本賽事由跨國電信與投資集團控股；國際主權基金以首席夥伴身分長期投入。多家國際車廠以原廠身分參賽，將賽道上發展的電驅與能源管理技術轉用於量產電動車。<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3><span class=\"n\">3.<\/span> 2026 年底啟用的新規格賽車，<span class=\"nw\">是本賽事創立以來最大的性能提升<\/span><\/h3><p>相較 2026 年賽季的賽車，新車最大輸出 600 kW（約 815 匹馬力）、靜止加速到時速一百公里 1.8 秒（一級方程式賽車約 2.6 秒）、全程主動四輪驅動、極速時速 335 公里。官方定調為「賽車運動的再發明」。<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3><span class=\"n\">4.<\/span> 九位車手進入最後一個比賽週末時仍有爭冠機會<\/h3><p>2025 至 2026 年的賽季最後一個比賽週末開始前，九位車手都還有機會奪冠，榜首僅領先 2 分。這是本賽事史上最接近的一次車手冠軍爭奪。<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3><span class=\"n\">5.<\/span> 觀眾成長，賽曆同步擴大<\/h3><p>2024 至 2025 年的賽季，單場平均 3,300 萬人次收看，年增 16%；數位影音觀看年增 47%，社群曝光 13.9 億次。自 2026 至 2027 年的賽季起，全球串流平台以多年合約在 144 個市場轉播全季每一場正賽、練習與排位。該季賽曆 21 場、13 個賽事地點、11 個國家，為創立以來最大。<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3><span class=\"n\">6.<\/span> 本賽事與城市、企業都容易結合<\/h3><p>低噪音與零廢氣排放，讓本賽事容易結合城市道路、夜間檔期與大型娛樂活動；東亞已有分站辦出當地首場夜間街道賽車。對品牌，一項合作同時帶來國際賽事曝光，並連結本賽事的永續成果：本賽事是全球第一個取得 B 型企業（B Corp）認證的運動項目。<\/p><\/article><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"s dark bg\" id=\"p4\" style=\"background-image:url(__IMG_city__)\">\n  <div class=\"shade\"><\/div>\n  <div class=\"wrap\">\n    <div class=\"eyebrow reveal\">城市級多日賽事檔期<\/div>\n    <h2 class=\"reveal\"><span class=\"nw\">一個世界錦標賽的比賽週末，<\/span><span class=\"nw\">延伸為連續三天的城市級檔期<\/span><\/h2>\n    <ol class=\"timeline\"><li class=\"reveal\"><div class=\"dot\"><\/div><div class=\"day\">第一天<span class=\"vh\">｜<\/span><\/div><h3>產業論壇與開幕演出<\/h3><p>日間舉行電動車與能源產業論壇，串接台灣的電池、充電、電力管理、資訊與通訊科技（ICT）與半導體供應鏈，並納入大學與基層教育場次。晚間為大型售票演出，吸引賽車迷以外的觀眾。<\/p><\/li>\n<li class=\"reveal\"><div class=\"dot\"><\/div><div class=\"day\">第二天<span class=\"vh\">｜<\/span><\/div><h3>第一場正式比賽<\/h3><p>比賽規劃在台灣既有的國際認證賽道舉行。比賽全日售票入場，粉絲園區與品牌展區同步開放。<\/p><\/li>\n<li class=\"reveal\"><div class=\"dot\"><\/div><div class=\"day\">第三天<span class=\"vh\">｜<\/span><\/div><h3>第二場正式比賽<\/h3><p>兩場比賽各自獨立計分。自 2026 至 2027 年的賽季起，本賽事多數分站採連續兩天、各一場正式比賽的形式。<\/p><\/li><\/ol>\n    <div class=\"audience reveal\">\n      <div class=\"alabel\">三天、三種觀眾<\/div>\n      <p>看比賽、看演出、談生意的人，共用同一個活動品牌與行銷資源。<\/p>\n      <p class=\"series\">規劃為多年期系列。<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"s light\" id=\"p5\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow reveal\">台灣的付費與到場紀錄<\/div>\n    <h2 class=\"reveal\"><span class=\"nw\">台灣已有<\/span><span class=\"nw\">賽車內容與大型現場娛樂的<\/span><span class=\"nw\">付費與到場紀錄<\/span><\/h2>\n    <div class=\"stats\"><div class=\"stat reveal\"><div class=\"label\">台灣觀眾為賽車內容付費<\/div><div class=\"big\"><span data-count=\"190\">190<\/span> 萬<\/div><p>電影《F1》在台灣拿下影史賣座第 19 名，推算約 190 萬觀影人次。<\/p><\/div>\n<div class=\"stat reveal\"><div class=\"label\">台灣觀眾到現場看賽車展演<\/div><div class=\"big\"><span data-count=\"3\">3<\/span> 萬 / <span data-count=\"12\">12<\/span> 萬<\/div><p>台中的國際車隊街頭極速展演，3 萬張門票售罄；連同周邊活動，三天累計吸引 12 萬人次。<\/p><\/div>\n<div class=\"stat reveal\"><div class=\"label\">台灣的大型現場娛樂付費市場<\/div><div class=\"big\">逾 <span data-count=\"300\">300<\/span> 萬 / <span data-count=\"373\">373<\/span> 萬<\/div><p>2024 年全台流行音樂展演售出逾 300 萬張票。江蕙復出，260 萬人搶約 20 萬張票，中籤率約 7.6%<span class=\"nw\">（推算）<\/span>。中華職棒 2025 年全年 373 萬人進場，場均首度破萬。<\/p><\/div>\n<div class=\"stat reveal\"><div class=\"label\">台灣觀眾跨縣市看演出<\/div><div class=\"big\"><span data-count=\"85\">85<\/span>%<\/div><p>大巨蛋的韓團演唱會，國內購票有 85% 來自外縣市。<\/p><\/div><\/div>\n    <div class=\"policy reveal\"><div class=\"label\">政策與產業條件都已具備<\/div><p>台灣有 2050 淨零路徑、上市櫃公司強制永續報告、公司治理評鑑納入體育贊助，以及完整的電動車與半導體供應鏈。2026 年的法規已有支持此類賽事的政策工具。<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"s light\" id=\"p6\">\n  <div class=\"wrap\">\n    <h2 class=\"reveal\"><span class=\"nw\">核心團隊成員<\/span><\/h2>\n    <div class=\"rule red reveal\"><\/div>\n    <p class=\"intro reveal\">MOTIVIBES 持有本賽事官方授予的在台展演活動授權，並爭取台灣分站主辦權；<b>正賽已進入賽事官方的正式前期規劃程序。<\/b><\/p>\n    <div class=\"tlabel reveal\">核心團隊涵蓋國際 IP、<br class=\"m\">大型活動、投資與公司治理四個領域<\/div>\n    <div class=\"team\"><article class=\"member reveal\"><h3>陳立展<span class=\"role\">｜執行長<\/span><\/h3><p>好萊塢影視 IP 與品牌合作近二十年，協助逾百個娛樂與商業專案在台灣、香港、中國大陸與日本執行，合作對象含好萊塢六大影視集團與日本索尼音樂；曾任 P. LEAGUE+ 品牌行銷總監、TVBS 行銷公關副總監。<\/p><\/article>\n<article class=\"member reveal\"><h3>高渭川<span class=\"role\">｜財務治理<\/span><\/h3><p>安侯建業（KPMG 台灣）投資控股副董事長、執業會計師，曾任美國上市收購公司董事兼財務長；截至 2026 年 8 月，任多家上市公司獨立董事。<\/p><\/article>\n<article class=\"member reveal\"><h3>林宗昀<span class=\"role\">｜商務開發<\/span><\/h3><p>曾任華特迪士尼行銷高階主管，主導好萊塢大片導演與主要演員的亞洲宣傳活動與首映，北京國際動漫展 BICAF 創辦人。<\/p><\/article><\/div>\n    <div class=\"panel\">\n      <div class=\"pitem reveal\"><div class=\"plabel\">進度（2026 年）<\/div><p>MOTIVIBES 與賽事官方自 2024 年起接觸，<br class=\"m\">場地技術文件已開始準備。<\/p><\/div>\n<div class=\"pitem reveal\"><div class=\"plabel\">會面方式<\/div><p>一對一會面。會面時提供完整版說明，<br class=\"m\">含場地、檔期、活動結構與目前進度。<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<footer class=\"pmfoot\">PROJECT MERIDIAN<\/footer>\n<\/div>\n", "lang": "zh-Hant", "title": "Project Meridian", "sw": "English"}, "en": {"html": "\n<div class=\"pm\" lang=\"en\">\n<section class=\"hero\" style=\"background-image:url(__IMG_cover__)\">\n  <div class=\"shade\"><\/div>\n  <div class=\"hero-wordmark\" aria-hidden=\"true\">MERIDIAN<span><\/span><\/div>\n  <div class=\"wrap\">\n    <div class=\"eyebrow up\"><span class=\"bar\"><\/span>PROJECT MERIDIAN<\/div>\n    <h1 class=\"up\">An international event at FIA World Championship level is being considered for Taiwan<\/h1>\n    <p class=\"sub up\"><span class=\"nw\">TARGET SUMMER 2028<\/span><span class=\"sep\">｜<\/span><span class=\"nw\">A FIRST FOR TAIWAN<\/span><span class=\"sep\">｜<\/span><span class=\"nw\">PROJECT MERIDIAN<\/span><\/p>\n    <div class=\"rule up\"><\/div>\n    <p class=\"company up\">MOTIVIBES<\/p>\n    <p class=\"legal up\">This overview describes the project direction only. Information current as of Q3 2026.<\/p>\n  <\/div>\n  <div class=\"scrollhint up\"><span><\/span><\/div>\n<\/section>\n\n<section class=\"s dark bg\" id=\"p2\" style=\"background-image:url(__IMG_global__)\">\n  <div class=\"shade\"><\/div>\n  <div class=\"wrap\">\n    <div class=\"eyebrow reveal\">THE OPPORTUNITY<\/div>\n    <h2 class=\"reveal\">Taiwan has never hosted an international motorsport event at this level<\/h2>\n    <div class=\"grid\"><article class=\"card reveal\"><span class=\"bar\"><\/span><h3>EVENT LEVEL<\/h3><p>An FIA World Championship is the highest level of international motorsport.<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3>GLOBAL AUDIENCE<\/h3><p>This event, under consideration for Taiwan (the Event), reached 561 million cumulative TV viewers in the 2024/25 season, up 14% year on year, with 422 million fans worldwide.<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3>THE OPENING IN ASIA<\/h3><p>In 2026, the Event's East Asian rounds are held in three cities, leaving clear room in the market.<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3>TIMING<\/h3><p>Target 2028. Taiwan already has an internationally certified circuit, so no new circuit is needed.<\/p><\/article><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"s dark\" id=\"p3\">\n  <div class=\"banner\" style=\"background-image:url(__IMG_performance__)\"><\/div>\n  <div class=\"wrap\">\n    <div class=\"eyebrow reveal\">THE EVENT'S SCALE AND OUTLOOK<\/div>\n    <h2 class=\"reveal\">A proven global event is growing across performance, calendar, and audience<\/h2>\n    <div class=\"grid\"><article class=\"card reveal\"><span class=\"bar\"><\/span><h3><span class=\"n\">1.<\/span> THE WORLD'S ONLY ALL-ELECTRIC FIA WORLD CHAMPIONSHIP<\/h3><p>Only a small number of competitions hold FIA World Championship status, and this is the only all-electric one. As the auto industry moves toward electric mobility, automakers need a world-class competition. The FIA has extended the Event's promotion rights to at least 2048, with an option for a further five years, while maintaining its exclusive all-electric status in single-seater racing.<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3><span class=\"n\">2.<\/span> MAJOR CAPITAL AND AUTOMAKERS ARE ALREADY COMMITTED<\/h3><p>The Event is controlled by a multinational telecommunications and investment group. An international sovereign wealth fund is a long-term principal partner. Several global automakers compete as factory teams and transfer the powertrain and energy-management technology developed in competition to production EVs.<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3><span class=\"n\">3.<\/span> THE EVENT'S BIGGEST PERFORMANCE UPGRADE ARRIVES AT THE END OF 2026<\/h3><p>Compared with the car used in the 2026 season, it delivers 600 kW (about 815 metric horsepower) at maximum output, accelerates from 0 to 100 km/h in 1.8 seconds (about 2.6 seconds for a Formula 1 car), uses active all-wheel drive throughout, and reaches 335 km/h. The official description is &quot;a reinvention of racing.&quot;<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3><span class=\"n\">4.<\/span> NINE DRIVERS ENTERED THE FINAL WEEKEND IN TITLE CONTENTION<\/h3><p>In the 2025/26 season, nine drivers entered the final weekend still able to win the championship, with the leader ahead by only two points. It was the closest drivers' title fight in the Event's history.<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3><span class=\"n\">5.<\/span> AUDIENCE AND CALENDAR GROWTH<\/h3><p>In the 2024/25 season, each race drew an average of 33 million viewers, up 16% year on year; digital video views grew 47% and social media impressions reached 1.39 billion. From the 2026/27 season, a global streaming platform will carry every race, practice session, and qualifying session of the season in 144 markets under a multi-year agreement. That season's calendar has 21 races across 13 locations in 11 countries, the largest in the Event's history.<\/p><\/article>\n<article class=\"card reveal\"><span class=\"bar\"><\/span><h3><span class=\"n\">6.<\/span> EASY TO CONNECT WITH CITIES AND BUSINESSES<\/h3><p>Low noise and zero tailpipe emissions make the Event well suited to city streets, night schedules, and major entertainment programs. One East Asian round has already staged that market's first night street race. For brands, one partnership can deliver international sports exposure and connect with the Event's sustainability record. The Event is the first sport in the world to receive B Corp certification.<\/p><\/article><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"s dark bg\" id=\"p4\" style=\"background-image:url(__IMG_city__)\">\n  <div class=\"shade\"><\/div>\n  <div class=\"wrap\">\n    <div class=\"eyebrow reveal\">A THREE-DAY CITY PROGRAM<\/div>\n    <h2 class=\"reveal\">One World Championship race weekend becomes a three-day city program<\/h2>\n    <ol class=\"timeline\"><li class=\"reveal\"><div class=\"dot\"><\/div><div class=\"day\">DAY ONE<span class=\"vh\"> | <\/span><\/div><h3>INDUSTRY FORUM AND OPENING SHOW<\/h3><p>During the day, an electric mobility and energy forum connects Taiwan's battery, charging, power management, information and communications technology (ICT), and semiconductor supply chains, with university and youth education sessions included. In the evening, a large ticketed show brings non-racing audiences into the weekend.<\/p><\/li>\n<li class=\"reveal\"><div class=\"dot\"><\/div><div class=\"day\">DAY TWO<span class=\"vh\"> | <\/span><\/div><h3>FIRST CHAMPIONSHIP RACE<\/h3><p>The Event is planned for an existing internationally certified circuit in Taiwan. Admission is ticketed for the full day, with the fan village and brand exhibition areas open throughout.<\/p><\/li>\n<li class=\"reveal\"><div class=\"dot\"><\/div><div class=\"day\">DAY THREE<span class=\"vh\"> | <\/span><\/div><h3>SECOND CHAMPIONSHIP RACE<\/h3><p>The two races award points independently. From the 2026/27 season, most rounds of the Event use a two-day format, with one championship race on each day.<\/p><\/li><\/ol>\n    <div class=\"audience reveal\">\n      <div class=\"alabel\">THREE DAYS, THREE AUDIENCES<\/div>\n      <p>Race fans, live entertainment audiences, and business participants share one brand entry point and one marketing platform.<\/p>\n      <p class=\"series\">Planned as a multi-year series.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"s light\" id=\"p5\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow reveal\">TAIWAN'S RECORD OF PAID CONTENT AND ATTENDANCE<\/div>\n    <h2 class=\"reveal\">Taiwan has a proven market for paid motorsport content and major live events<\/h2>\n    <div class=\"stats\"><div class=\"stat reveal\"><div class=\"label\">PAID MOTORSPORT CONTENT<\/div><div class=\"big\"><span data-count=\"1.9\" data-dec=\"1\">1.9<\/span> MILLION<\/div><p>The film F1 became Taiwan's 19th highest-grossing film of all time, with an estimated 1.9 million admissions.<\/p><\/div>\n<div class=\"stat reveal\"><div class=\"label\">LIVE MOTORSPORT SHOWCASES<\/div><div class=\"big\"><span data-count=\"30\">30<\/span>K / <span data-count=\"120\">120<\/span>K<\/div><p>An international racing team's high-speed street showcase in Taichung sold all 30,000 tickets. Together with surrounding activities, the three-day program drew 120,000 visits.<\/p><\/div>\n<div class=\"stat reveal\"><div class=\"label\">A MATURE LIVE ENTERTAINMENT MARKET<\/div><div class=\"big\">OVER <span data-count=\"3\">3<\/span>M / <span data-count=\"3.73\" data-dec=\"2\">3.73<\/span>M<\/div><p>In 2024, pop music events in Taiwan sold more than 3 million tickets. A major Taiwanese singer's comeback drew 2.6 million people for about 200,000 tickets, an estimated 7.6% success rate. Taiwan's professional baseball league drew 3.73 million attendees in 2025, with average attendance exceeding 10,000 for the first time.<\/p><\/div>\n<div class=\"stat reveal\"><div class=\"label\">AUDIENCES TRAVEL BETWEEN CITIES<\/div><div class=\"big\"><span data-count=\"85\">85<\/span>%<\/div><p>For a K-pop concert at Taipei Dome, 85% of domestic ticket buyers came from outside Taipei.<\/p><\/div><\/div>\n    <div class=\"policy reveal\"><div class=\"label\">POLICY AND INDUSTRY ALIGNMENT<\/div><p>Taiwan's 2050 net-zero pathway, mandatory sustainability reporting for listed companies, inclusion of sports sponsorship in corporate governance evaluations, and strong EV and semiconductor supply chains all support this type of project. Taiwan's 2026 regulations include policy tools that support events of this kind.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"s light\" id=\"p6\">\n  <div class=\"wrap\">\n    <h2 class=\"reveal\">Core team<\/h2>\n    <div class=\"rule red reveal\"><\/div>\n    <p class=\"intro reveal\">MOTIVIBES holds official authorization from the Event for exhibition activities in Taiwan and is pursuing the rights to host a championship race in Taiwan. <b>The race is now in the Event's formal early-stage planning process.<\/b><\/p>\n    <div class=\"tlabel reveal\">The core team spans international IP, large-scale events, investment, and corporate governance<\/div>\n    <div class=\"team\"><article class=\"member reveal\"><h3>Lee Chen<span class=\"role\"> | CEO<\/span><\/h3><p>Nearly 20 years of experience in film and entertainment IP and brand partnerships. Helped more than 100 entertainment and commercial projects launch across Taiwan, Mainland China, Hong Kong, and Japan, working with all six major Hollywood studios and Sony Music Japan. Former Brand Marketing Director at P. LEAGUE+ and Senior Vice President of Marketing and Communications at TVBS.<\/p><\/article>\n<article class=\"member reveal\"><h3>高渭川<span class=\"role\"> | Financial Governance<\/span><\/h3><p>Vice Chairman of Investment Holdings at KPMG Taiwan and a certified public accountant. Former director and CFO of a US-listed acquisition company. As of August 2026, an independent director at several listed companies.<\/p><\/article>\n<article class=\"member reveal\"><h3>林宗昀<span class=\"role\"> | Business Development<\/span><\/h3><p>Former senior marketing executive at The Walt Disney Company. Led Asian events and premieres for major Hollywood films and founded BICAF, the Beijing International Comic and Animation Festival.<\/p><\/article><\/div>\n    <div class=\"panel\">\n      <div class=\"pitem reveal\"><div class=\"plabel\">CURRENT STATUS, 2026<\/div><p>MOTIVIBES and the Event have been in contact since 2024. Preparation of technical venue documents has begun.<\/p><\/div>\n<div class=\"pitem reveal\"><div class=\"plabel\">MEETING FORMAT<\/div><p>A one-to-one meeting. A full presentation will cover the venue, timing, program structure, and current progress.<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<footer class=\"pmfoot\">PROJECT MERIDIAN<\/footer>\n<\/div>\n", "lang": "en", "title": "Project Meridian", "sw": "中文"}};

  var html=C[code].html;for(var k in C.img){html=html.split('__IMG_'+k+'__').join(C.img[k]);}
  app.innerHTML=html;app.hidden=false;pick.hidden=true;cur=code;
  document.documentElement.lang=C[code].lang;document.title=C[code].title;
  sw.textContent=C[code].sw;sw.hidden=false;window.scrollTo(0,0);boot();
  if(window.MX)MX.scan(document);
}
function boot(){
  var bar=document.getElementById('bar');
  function prog(){var d=document.documentElement,m=d.scrollHeight-d.clientHeight;bar.style.width=(m>0?Math.min(100,100*d.scrollTop/m):0)+'%';}
  window.addEventListener('scroll',prog,{passive:true});prog();
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fmt(v,dec){return dec>0?v.toFixed(dec):Math.round(v).toLocaleString();}
  function count(el){var to=parseFloat(el.getAttribute('data-count'))||0,dec=parseInt(el.getAttribute('data-dec')||'0',10),t0=null,dur=1300;
    function step(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/dur);k=1-Math.pow(1-k,3);el.textContent=fmt(to*k,dec);if(k<1)requestAnimationFrame(step);}
    if(reduce){el.textContent=fmt(to,dec);return;}el.textContent=fmt(0,dec);requestAnimationFrame(step);}
  window.__pmBooted=true;
  var sda=!!(window.CSS&&CSS.supports&&CSS.supports('animation-timeline: view()'));/* 瀏覽器自己會做捲動驅動進場，JavaScript 只負責數字跑動 */
  var els=app.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)||reduce){els.forEach(function(e){if(!sda)e.classList.add('in');e.querySelectorAll('[data-count]').forEach(count);});return;}
  var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){if(!sda)x.target.classList.add('in');x.target.querySelectorAll('[data-count]').forEach(count);io.unobserve(x.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:.12});
  els.forEach(function(e){io.observe(e);});
}

sw.addEventListener('click',function(){render(cur==='zh'?'en':'zh');});
var m=/[?&]lang=(zh|en)\b/.exec(location.search);if(m)render(m[1]);
